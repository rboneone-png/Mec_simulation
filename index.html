<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MecSim 應力應變模擬</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">MecSim <span>結構分析・線性／彈塑性</span></div>
    <div class="seg page-tabs" id="pageTabs"><button data-page="fea" class="on">🧊 結構模擬</button><button data-page="ins">📌 插入力計算</button></div>
    <input id="projName" class="proj-name" type="text" value="未命名專案" title="專案名稱（儲存與報告的預設檔名）" />
    <div class="top-actions">
      <label class="btn ghost" title="開啟 .mecsim 專案檔">📂 開啟<input id="fileProj" type="file" accept=".mecsim,.json" hidden /></label>
      <button id="btnSave" class="btn ghost" title="儲存專案（Ctrl+S）">💾 儲存</button>
      <button id="btnPdf" class="btn ghost" title="匯出 PDF 報告">📄 存 PDF</button>
      <span class="tb-sep fea-only"></span>
      <label class="btn fea-only">匯入 STEP<input id="fileStep" type="file" accept=".step,.stp" multiple hidden /></label>
      <button id="btnDemo" class="btn ghost fea-only">載入示範組合件</button>
      <button id="btnClear" class="btn ghost fea-only">清除</button>
    </div>
  </header>

  <main class="layout" id="feaPage">
    <aside class="panel" id="panel">
      <section>
        <h3>零件 <small id="partCount"></small></h3>
        <div id="partList" class="list"><div class="empty">尚未載入模型。請匯入 STEP 檔或載入示範組合件。</div></div>
      </section>

      <section id="matSection" hidden>
        <h3>材料 <small id="matPartName"></small></h3>
        <div class="grid2">
          <div class="full mat-cat">
            <div class="seg seg-sm" id="matCat"><button data-cat="all" class="on">全部</button><button data-cat="metal">金屬</button><button data-cat="plastic">塑膠</button></div>
            <button class="btn sm ghost" id="matApplyAll" title="將此材料套用到所有零件">套用到全部零件</button>
          </div>
          <label class="full">材料庫<select id="matKey"></select></label>
          <label>E 楊氏模數 [GPa]<input id="matE" type="number" step="any" /></label>
          <label>ν 蒲松比<input id="matNu" type="number" step="0.01" min="0" max="0.49" /></label>
          <label>σy 降伏強度 [MPa]<input id="matSy" type="number" step="any" /></label>
          <label>σu 抗拉強度 [MPa]<input id="matSu" type="number" step="any" /></label>
          <label>ρ 密度 [kg/m³]<input id="matRho" type="number" step="any" /></label>
          <label>零件質量<span class="readout" id="matMass">—</span></label>
        </div>
        <div class="note" id="matNote" hidden></div>
        <canvas id="ssChart" class="chart"></canvas>
      </section>

      <section>
        <h3>零件結合</h3>
        <div id="contactBox" class="empty">產生網格後會自動偵測互相接觸的零件。</div>
      </section>

      <section>
        <h3>邊界條件</h3>
        <div class="btn-row">
          <button class="btn sm" data-add="fixed">＋ 固定約束</button>
          <button class="btn sm" data-add="force">＋ 力</button>
          <button class="btn sm" data-add="pressure">＋ 壓力</button>
        </div>
        <div id="bcList" class="list"></div>
        <div id="bcEditor" class="bc-editor" hidden></div>
      </section>

      <section>
        <h3>網格</h3>
        <div class="grid2">
          <label class="full">網格方法<select id="meshMethod">
            <option value="hex20">六面體 HEX20（貼體二次元素，建議）</option>
            <option value="hex8">六面體 HEX8（貼體一次元素）</option>
            <option value="tet">四面體 TET10（fTetWild）</option>
          </select></label>
          <label>元素尺寸 [mm]<input id="meshSize" type="number" step="any" min="0" placeholder="自動" /></label>
        </div>
        <button id="btnMesh" class="btn sm block2">產生網格</button>
        <div class="mesh-info" id="meshInfo">尚未產生網格</div>
      </section>

      <section>
        <h3>分析設定</h3>
        <div class="grid2">
          <label class="full">分析類型<select id="anaType">
            <option value="linear">線性靜力（線彈性）</option>
            <option value="plastic">非線性靜力（彈塑性 J2，等向硬化）</option>
          </select></label>
          <label>負載倍率<input id="loadFactor" type="number" step="any" min="0" value="1" /></label>
          <label class="plastic-only">負載步數<input id="nSteps" type="number" step="1" min="1" max="100" value="10" /></label>
          <label>線性求解容許誤差<select id="tol"><option value="1e-5">1e-5</option><option value="1e-6" selected>1e-6</option><option value="1e-7">1e-7</option></select></label>
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button id="btnRun" class="btn primary grow">▶ 執行模擬</button>
          <button id="btnCancel" class="btn ghost" hidden>取消</button>
        </div>
        <div class="progress" id="progress" hidden><div class="bar"></div><span class="txt"></span></div>
        <div id="log" class="log"></div>
      </section>

      <section id="resSection" hidden>
        <h3>結果</h3>
        <div class="grid2">
          <label class="full">顯示量<select id="resType">
            <option value="vm">von Mises 應力 [MPa]</option>
            <option value="umag">總位移 [mm]</option>
            <option value="ux">位移 Ux [mm]</option>
            <option value="uy">位移 Uy [mm]</option>
            <option value="uz">位移 Uz [mm]</option>
            <option value="pe">等效塑性應變 PEEQ</option>
          </select></label>
          <label class="full step-row" id="stepRow">負載步 <span class="val" id="stepVal"></span><input id="stepSlider" type="range" min="0" max="0" step="1" value="0" /></label>
          <label class="check"><input id="showDeform" type="checkbox" checked /> 顯示變形</label>
          <label>變形放大倍率<input id="deformScale" type="number" step="any" /></label>
          <label>等值線<select id="bands">
            <option value="0">連續漸層</option><option value="8">8 段</option><option value="12" selected>12 段</option><option value="16">16 段</option><option value="24">24 段</option>
          </select></label>
          <label class="check" style="align-self:end"><input id="showMinMax" type="checkbox" checked /> 標示最大／最小</label>
        </div>

        <div class="subhead">剖面</div>
        <div class="grid2">
          <label class="check"><input id="secOn" type="checkbox" /> 啟用剖面</label>
          <div class="seg seg-sm" id="secAxis"><button data-axis="0" class="on">X</button><button data-axis="1">Y</button><button data-axis="2">Z</button></div>
          <label class="full">位置 <span class="val" id="secVal"></span><input id="secPos" type="range" min="0" max="1000" value="500" /></label>
          <label class="check"><input id="secFlip" type="checkbox" /> 反向</label>
        </div>

        <div class="subhead">動態展示</div>
        <div class="grid2">
          <label class="full">動畫類型<select id="animType">
            <option value="deform">變形動畫（0 → 最大，往返）</option>
            <option value="deform1">變形動畫（0 → 最大，單向循環）</option>
            <option value="steps">負載步播放（彈塑性）</option>
          </select></label>
          <label class="full">速度 <span class="val" id="animSpeedVal"></span><input id="animSpeed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button id="btnPlay" class="btn sm">▶ 播放</button>
          <button id="btnRec" class="btn sm ghost">● 錄製 WebM</button>
        </div>
        <table class="stats" id="statsTable"></table>
        <canvas id="ldChart" class="chart"></canvas>
        <div class="btn-row">
          <button id="btnShot" class="btn sm ghost">截圖 PNG</button>
          <button id="btnCsv" class="btn sm ghost">匯出 CSV</button>
        </div>
      </section>
    </aside>

    <div class="splitter" id="splitter"></div>

    <section class="viewport">
      <div class="view-toolbar">
        <div class="seg" id="modeSeg">
          <button data-mode="model" class="on">模型</button>
          <button data-mode="result" disabled>結果</button>
        </div>
        <div class="seg">
          <button data-view="fit" title="適合視窗">⤢</button>
          <button data-view="iso">等角</button>
          <button data-view="front">前</button>
          <button data-view="right">右</button>
          <button data-view="top">上</button>
        </div>
        <label class="check small"><input id="showEdges" type="checkbox" checked /> 邊線</label>
        <label class="check small"><input id="showMesh" type="checkbox" /> 網格</label>
        <label class="check small"><input id="hiQ" type="checkbox" /> 高畫質</label>
      </div>
      <div id="canvasHost" class="canvas-host"></div>
      <div id="pickHint" class="pick-hint" hidden></div>
      <div id="legend" class="legend" hidden>
        <div class="legend-title" id="legendTitle"></div>
        <div class="legend-body"><div class="legend-bar" id="legendBar"></div><div class="legend-ticks" id="legendTicks"></div></div>
      </div>
      <div class="statusbar" id="status">就緒</div>
      <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyTxt">處理中…</span></div>
    </section>
  </main>

  <main class="layout" id="insPage" hidden>
    <aside class="panel">
      <section>
        <h3>計算類型</h3>
        <div class="seg ins-kind" id="insKind"><button data-kind="press" class="on">壓入配合（軸／孔）</button><button data-kind="snap">懸臂卡扣</button></div>
        <div class="note" style="color:var(--text-dim)" id="insKindNote"></div>
      </section>
      <section>
        <h3>材料</h3>
        <div class="grid2">
          <label class="full press-only">軸（插入件）<select id="insShaft"></select></label>
          <label class="full press-only">軸套（被壓入件）<select id="insHub"></select></label>
          <label class="full snap-only">卡扣材料<select id="insSnapMat"></select></label>
        </div>
        <div class="mat-brief" id="insMatBrief"></div>
      </section>
      <section>
        <h3>尺寸 [mm]</h3>
        <div class="grid2 press-only">
          <label>d 公稱直徑<input id="in_d" type="number" step="any" min="0" value="20" /></label>
          <label>D 軸套外徑<input id="in_D" type="number" step="any" min="0" value="40" /></label>
          <label>δ 直徑干涉量<input id="in_delta" type="number" step="0.001" min="0" value="0.02" /></label>
          <label>dᵢ 軸內徑（0＝實心）<input id="in_di" type="number" step="any" min="0" value="0" /></label>
          <label>L 軸套長度<input id="in_L" type="number" step="any" min="0" value="20" /></label>
          <label>S 壓入深度<input id="in_S" type="number" step="any" min="0" value="20" /></label>
          <label>α 導角角度 [°]<input id="in_alpha" type="number" step="any" min="1" max="80" value="15" /></label>
        </div>
        <div class="grid2 snap-only">
          <label>L 懸臂長度<input id="sn_L" type="number" step="any" min="0" value="15" /></label>
          <label>h 根部厚度<input id="sn_h" type="number" step="any" min="0" value="1.5" /></label>
          <label>b 寬度<input id="sn_b" type="number" step="any" min="0" value="5" /></label>
          <label>y 卡勾高度（撓度）<input id="sn_y" type="number" step="any" min="0" value="1" /></label>
          <label>α 插入角 [°]<input id="sn_alpha" type="number" step="any" min="1" max="89" value="30" /></label>
          <label>α′ 退出角 [°]<input id="sn_alpha2" type="number" step="any" min="1" max="90" value="90" /></label>
        </div>
      </section>
      <section>
        <h3>摩擦與材料模型</h3>
        <div class="grid2">
          <label>摩擦係數 μ<input id="insMu" type="number" step="0.01" min="0" max="2" value="0.15" /></label>
          <label>參考值<select id="insMuPreset"></select></label>
          <label class="full">應力-應變模型<select id="insModel">
            <option value="curve">依應力-應變曲線（含降伏／硬化，非線性）</option>
            <option value="linear">線彈性（傳統公式）</option>
          </select></label>
        </div>
        <div class="note" style="color:var(--text-dim)">修改任一參數會自動重新計算。曲線圖中虛線為線彈性公式的對照結果。</div>
      </section>
    </aside>
    <div class="splitter" style="cursor:default"></div>
    <section class="ins-view" id="insView">
      <div class="kpis" id="insKpis"></div>
      <div class="ins-warn" id="insWarn" hidden></div>
      <div class="card wide"><canvas id="insForce" class="chart chart-lg"></canvas></div>
      <div class="card"><div class="card-h">示意圖</div><canvas id="insSketch" class="chart chart-md"></canvas></div>
      <div class="card"><div class="card-h">結果明細</div><table class="stats" id="insTable"></table></div>
      <div class="card" id="insSS1Card"><div class="card-h" id="insSS1T"></div><canvas id="insSS1" class="chart chart-md"></canvas></div>
      <div class="card" id="insSS2Card"><div class="card-h" id="insSS2T"></div><canvas id="insSS2" class="chart chart-md"></canvas></div>
      <div class="card wide method" id="insMethod"></div>
    </section>
  </main>
  <div id="nameDlg" class="modal" hidden>
    <form class="dlg" id="nameForm">
      <h4 id="dlgTitle">儲存</h4>
      <label>檔案名稱
        <div class="name-row"><input id="dlgName" type="text" required /><span id="dlgExt"></span></div>
      </label>
      <div class="dlg-hint" id="dlgHint"></div>
      <div class="btn-row dlg-btns">
        <button type="button" class="btn ghost" id="dlgCancel">取消</button>
        <button type="submit" class="btn" id="dlgOk">確定</button>
      </div>
    </form>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
